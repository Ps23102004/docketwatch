<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>DocketWatch</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <!-- Shared shell only: feature workers own the contents of the marked mount points. -->
  <header class="nav">
    <a class="logo" href="#cases" aria-label="DocketWatch case list">
      DocketWatch<span class="dot" aria-hidden="true"></span>
    </a>
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="#cases" data-view-link="cases" aria-current="page">Cases</a>
      <a href="#case" data-view-link="case">Case detail</a>
    </nav>
  </header>

  <main class="stage" id="main-content" tabindex="-1">
    <p id="app-status" class="app-status" role="status" aria-live="polite"></p>

    <!-- Case-list worker: render list, loading, empty, and error states in #case-list. -->
    <section id="case-list-view" class="app-view is-active" data-view="cases" aria-labelledby="case-list-heading">
      <header class="surface-header">
        <h1 id="case-list-heading" class="display">Tracked cases</h1>
        <p>Monitor recent filings and open a case for its full docket history.</p>
      </header>

      <form id="track-form" class="ask-form" aria-label="Track a new case">
        <input id="track-input" type="text" placeholder="Docket id to track (e.g. fixture-alpha-1)" aria-label="Docket id to track">
        <button type="submit" class="go">Track</button>
      </form>
      <div id="track-status"></div>

      <div id="case-list" class="case-list" aria-live="polite" aria-busy="true">
        <div class="state-panel glass">
          <span class="spinner-ring" aria-hidden="true"></span>
          <h2>Loading cases</h2>
          <p>DocketWatch is reading the cases tracked on this device.</p>
        </div>
      </div>

      <form id="case-search-form" class="search-wrap glass" aria-label="Search for a case to track">
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input id="case-search-input" class="search-input" type="search" placeholder="Search for a case by name, docket number or court" aria-label="Search for a case">
      </form>
      <div id="case-search-results"></div>
    </section>

    <!-- Case-detail worker: remove `hidden`, populate the mount points, and update nav state. -->
    <section id="case-detail-view" class="app-view" data-view="case" aria-labelledby="case-detail-title" hidden>
      <a class="back-link" href="#cases">Back to cases</a>
      <header class="surface-header">
        <h1 id="case-detail-title" class="display">Case detail</h1>
        <p id="case-detail-meta">Select a tracked case to view its filings.</p>
      </header>

      <div id="case-detail-summary" class="detail-summary"></div>
      <section id="case-timeline" class="detail-section" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading">Timeline</h2>
        <div id="timeline-list"></div>
      </section>
      <section id="case-digest" class="detail-section" aria-labelledby="digest-heading">
        <h2 id="digest-heading">Digest</h2>
        <div id="digest-content"></div>
      </section>
      <section id="case-ask" class="detail-section" aria-labelledby="ask-heading">
        <h2 id="ask-heading">Ask about this case</h2>
        <div id="ask-content"></div>
      </section>
    </section>
  </main>

  <script src="lib/api.js"></script>
  <script src="sections/case-detail.js"></script>
  <script src="sections/case-list.js"></script>
</body>
</html>
